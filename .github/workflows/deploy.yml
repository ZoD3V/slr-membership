name: Deploy SLR Membership

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Environment to Deploy"
        type: choice
        required: true
        default: "dev"
        options:
          - dev
          - prod
      restart_only:
        description: "Restart services without rebuilding? (true/false)"
        type: boolean
        required: true
        default: false

concurrency:
  group: deploy-slr-membership-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  set-env:
    name: Determine Environment
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.env_setup.outputs.target_env }}
      image_tag: ${{ steps.env_setup.outputs.image_tag }}
    steps:
      - name: Calculate target environment and image tag
        id: env_setup
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            TARGET_ENV="prod"
          else
            TARGET_ENV="dev"
          fi

          if [ "$TARGET_ENV" = "prod" ]; then
            IMAGE_TAG="prod"
          else
            IMAGE_TAG="dev"
          fi

          echo "target_env=${TARGET_ENV}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "Target Environment: ${TARGET_ENV}"
          echo "Image Tag Prefix: ${IMAGE_TAG}"

  build-and-push:
    name: Build & Push Docker Image (${{ needs.set-env.outputs.target_env }})
    needs: set-env
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.restart_only != true && github.event.inputs.restart_only != 'true' }}

    permissions:
      contents: read
      packages: write

    outputs:
      image_name: ${{ steps.vars.outputs.image_name }}
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image name
        id: vars
        run: |
          IMAGE_NAME="${GITHUB_REPOSITORY,,}"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.set-env.outputs.image_tag }}
            type=sha,prefix=${{ needs.set-env.outputs.image_tag }}-
            type=raw,value=latest,enable=${{ needs.set-env.outputs.target_env == 'prod' }}

      - name: Inject .env file for Docker build
        run: |
          TARGET_ENV="${{ needs.set-env.outputs.target_env }}"
          if [ "$TARGET_ENV" = "prod" ]; then
            ENV_CONTENT='${{ vars.ENV_FILE_PROD || secrets.ENV_FILE_PROD }}'
          else
            ENV_CONTENT='${{ vars.ENV_FILE_DEV || secrets.ENV_FILE_DEV }}'
          fi

          if [ -n "$ENV_CONTENT" ]; then
            echo "$ENV_CONTENT" > .env
            echo "[INFO] Successfully injected .env for ${TARGET_ENV} build."
          else
            echo "[WARNING] ENV_FILE_${TARGET_ENV^^} is NOT set in GitHub Variables/Secrets!"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to VPS (${{ needs.set-env.outputs.target_env }})
    needs: [set-env, build-and-push]
    if: ${{ always() && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.SSH_KEY || vars.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ vars.SSH_PORT || secrets.SSH_PORT || 22 }} -H "${{ vars.SSH_HOST || secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Resolve deployment environment paths and secrets
        run: |
          TARGET_ENV="${{ needs.set-env.outputs.target_env }}"

          if [ "$TARGET_ENV" = "prod" ]; then
            DEPLOY_PATH="${{ vars.DEPLOY_PATH_PROD || secrets.DEPLOY_PATH_PROD || '/home/ubuntu/frontend/slr-membership' }}"
            ENV_CONTENT='${{ vars.ENV_FILE_PROD || secrets.ENV_FILE_PROD }}'
          else
            DEPLOY_PATH="${{ vars.DEPLOY_PATH_DEV || secrets.DEPLOY_PATH_DEV || '/home/ubuntu/frontend/slr-membership-dev' }}"
            ENV_CONTENT='${{ vars.ENV_FILE_DEV || secrets.ENV_FILE_DEV }}'
          fi

          echo "DEPLOY_PATH=${DEPLOY_PATH}" >> $GITHUB_ENV

          echo "=== RESOLVED CONFIGURATION ==="
          echo "Target Environment : ${TARGET_ENV}"
          echo "Deploy Path        : ${DEPLOY_PATH}"
          echo "Env Content Length : ${#ENV_CONTENT} chars"
          echo "=============================="

          ssh -p ${{ vars.SSH_PORT || secrets.SSH_PORT || 22 }} ${{ vars.SSH_USER || secrets.SSH_USER }}@${{ vars.SSH_HOST || secrets.SSH_HOST }} "mkdir -p ${DEPLOY_PATH}"

          if [ -n "$ENV_CONTENT" ]; then
            echo "$ENV_CONTENT" > .env.temp
            scp -P ${{ vars.SSH_PORT || secrets.SSH_PORT || 22 }} .env.temp ${{ vars.SSH_USER || secrets.SSH_USER }}@${{ vars.SSH_HOST || secrets.SSH_HOST }}:${DEPLOY_PATH}/.env
            rm -f .env.temp
            echo "[INFO] Successfully deployed ${TARGET_ENV} .env to ${DEPLOY_PATH}."
          else
            echo "[ERROR] ENV_FILE_${TARGET_ENV^^} is NOT set in GitHub Variables/Secrets! The remote VPS .env was NOT updated."
          fi

      - name: Sync docker-compose.yml to VPS
        run: |
          scp -P ${{ vars.SSH_PORT || secrets.SSH_PORT || 22 }} docker-compose.yml ${{ vars.SSH_USER || secrets.SSH_USER }}@${{ vars.SSH_HOST || secrets.SSH_HOST }}:${DEPLOY_PATH}/docker-compose.yml
          echo "[INFO] docker-compose.yml synced to VPS."

      - name: Deploy Docker services via SSH
        run: |
          RESTART_ONLY="${{ github.event.inputs.restart_only || 'false' }}"
          TAG="${{ needs.set-env.outputs.image_tag }}"
          GHCR_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"

          ssh -p ${{ vars.SSH_PORT || secrets.SSH_PORT || 22 }} ${{ vars.SSH_USER || secrets.SSH_USER }}@${{ vars.SSH_HOST || secrets.SSH_HOST }} "bash -s" <<EOF
            cd ${DEPLOY_PATH}

            echo "Target Environment: ${{ needs.set-env.outputs.target_env }}"
            echo "Image: ${GHCR_IMAGE}"
            echo "Restart Only: ${RESTART_ONLY}"

            echo "${{ vars.GHCR_PAT || secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            grep -q '^GHCR_IMAGE=' .env 2>/dev/null && sed -i "s|^GHCR_IMAGE=.*|GHCR_IMAGE=${GHCR_IMAGE}|" .env || echo "GHCR_IMAGE=${GHCR_IMAGE}" >> .env

            DOCKER_NETWORK=\$(grep -E '^DOCKER_NETWORK=' .env 2>/dev/null | cut -d'=' -f2 | tr -d '\r\n')
            DOCKER_NETWORK=\${DOCKER_NETWORK:-shared-network}

            if ! docker network ls | grep -q "\${DOCKER_NETWORK}"; then
              echo "[INFO] Creating network: \${DOCKER_NETWORK}"
              docker network create "\${DOCKER_NETWORK}"
            else
              echo "[INFO] Network '\${DOCKER_NETWORK}' exists."
            fi

            if [ "${RESTART_ONLY}" = "true" ]; then
              echo "[INFO] Restarting services..."
              docker compose --env-file .env restart
            else
              echo "[INFO] Pulling latest image..."
              docker compose --env-file .env pull

              echo "[INFO] Starting services..."
              docker compose --env-file .env up -d --force-recreate --remove-orphans
            fi

            echo "[INFO] Service status:"
            docker compose --env-file .env ps

            docker image prune -af
          EOF

      - name: Deployment complete
        run: echo "[SUCCESS] SLR Membership successfully deployed to [${{ needs.set-env.outputs.target_env }}] environment."

  cleanup-registry:
    name: Cleanup Old Images
    needs: [set-env, deploy]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Delete old images from GHCR
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: true
